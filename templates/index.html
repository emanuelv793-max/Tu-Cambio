<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}">
  <meta name="theme-color" content="#f97316">
  <link rel="canonical" href="{{ canonical_url }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:site_name" content="{{ app_name }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ page_description }}">
  <script type="application/ld+json">{{ seo_schema | tojson }}</script>
  <link rel="stylesheet" href="{{ frontend_css_url }}">
</head>
<body>
  <div id="root"></div>
  <noscript>
    <main style="max-width:960px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;color:#351303;">
      <h1>{{ app_name }}</h1>
      <p>{{ page_description }}</p>
      <p>Activa JavaScript para ver la experiencia completa con scroll inmersivo.</p>
    </main>
  </noscript>
  <script id="bootstrap-data" type="application/json">{{ bootstrap_data | tojson }}</script>
  <script type="module" src="{{ frontend_js_url }}"></script>
</body>
</html>
